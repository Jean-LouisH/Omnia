Entity:
  name: "DemoUtilityScripts"
  ScriptCollection:
    CPP: ["EscapeToSelectionMenu", "ReloadActiveScene", "ToggleFullscreen"]
  Label:
    text: "[ESC] - Menu, [F5] - Reload Scene, [F11] - Toggle Fullscreen, [F12] - Developer\nLeft - Previous, Right - Next"
    font: ["fonts/Lato-Regular.ttf", 13]
    text_colour: "#FFFFFFFF"
    pivot: "top_left"
    anchor_pivot: "top_left"
Entity:
  name: "Image Viewer"
  AudioSource:
    play_infinitely: false
  AudioListener: "default"
  ScriptCollection:
    Python: ["scenes/apps/image_viewer/image_viewer.py"]
Entity:
  name: "Slideshow Timer"
  Timer: default
Entity:
  name: "Start Message"
  Label: 
    text: "Drop a .jpg or .png file onto the window to view it and all the other images in the same folder."
    font: ["fonts/Lato-Regular.ttf", 20]
    text_colour: "#FFFFFFFF"
    pivot: "centre"
    anchor_pivot: "centre"
Entity:
  name: "Image"
  ImageCanvas: 
    pivot: "centre"
    anchor_pivot: "centre"
Entity:
  name: "Slideshow Button"
  Button:
    text: "Slideshow"
    font: ["fonts/Lato-Regular.ttf", 20]
    text_colour: "#000000FF"
    pivot: "bottom_centre"
    anchor_pivot: "bottom_centre"
    margin: [0.0, 5.0]
Entity:
  name: "Camera"
  Camera: "default"
    font: ["fonts/Lato-Regular.ttf", 13]
    text_colour: "#FFFFFFFF"
    pivot: "top_left"
    anchor_pivot: "top_left"
Entity:
  name: "CameraPivot"
Entity:
  name: "Camera"
  parent: "CameraPivot"
  transform:
    translation: [0.0, 0.0, 1.0]
  Camera: 
    clear_colour: "#CCCCCCFF"
    enable_flyby_mode_on_default_input: true